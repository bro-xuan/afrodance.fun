# Hourly snapshot of the /marketintel pulse scores, for its track record.
#
# Vercel Hobby crons run at most daily, so GitHub's scheduler is the clock.
# The endpoint records at most one snapshot per UTC hour no matter who calls
# it (visitors also trigger it lazily), so it needs no secret and a late or
# duplicate run is harmless. GitHub delays scheduled runs under load and
# sometimes skips one; the grader tolerates small gaps.

name: Record market pulse

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: record-pulse
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Snapshot
        run: |
          curl -fsS --retry 2 --retry-delay 20 --max-time 70 \
            "https://www.afrodance.fun/api/marketintel/pulse?record=1" \
            | jq -c '{samples, recorded: (.recorded | if . then {t, px, h} else null end), sources}'
