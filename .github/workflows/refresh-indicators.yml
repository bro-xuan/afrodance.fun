# Daily refresh of the BTC bottom-indicator snapshot.
#
# bitcoin-data.com's free tier allows ~10 requests/hour, and the registry in
# scripts/fetch-indicators.mjs can exceed that. The script handles this: on
# 429 it merges what it fetched into the existing snapshot and exits 0, and it
# fetches stalest metrics first. Two runs spaced >1h apart therefore cover the
# whole registry every day even when a single run can't.
#
# The push to main triggers the normal Vercel production deploy, so the page
# refreshes without any manual step. (Note: `schedule` only fires from the
# workflow file on the default branch; if main is branch-protected, allow
# github-actions[bot] to push or swap GITHUB_TOKEN for a PAT.)

name: Refresh BTC bottom indicators

on:
  schedule:
    - cron: "23 5 * * *" # first pass
    - cron: "53 6 * * *" # finisher for anything rate-limited in the first pass
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-indicators
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The script is dependency-free (node:fs + global fetch) — no npm ci.
      - name: Fetch indicators
        run: node scripts/fetch-indicators.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/bottom_indicator/data/indicators.json
          # -I: a run that only bumped timestamps (no new data) is not worth
          # a commit + production deploy.
          if git diff --cached --quiet -I '"generatedAt":' -I '"fetchedAt":'; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          git commit -m "chore(bottom-indicator): daily snapshot refresh"
          git pull --rebase origin main
          git push origin main
